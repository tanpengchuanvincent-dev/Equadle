<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equadle</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; text-align: center; background: #f4f4f9; color: #333; }
    .instructions { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; line-height: 1.6; }
    .instructions h2 { margin-top: 0; font-size: 18px; text-align: center; }
    .instructions ul { list-style: none; padding-left: 0; margin-bottom: 0; }
    .instructions li { margin-bottom: 10px; }
    .badge { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 8px; }
    a { display: block; padding: 15px; margin: 12px 0; background: #2ea44f; color: white; text-decoration: none; border-radius: 6px; font-size: 18px; font-weight: bold; }
    a:hover { background: #2c974b; }
  </style>
</head>
<body>
  <h1>Equadle</h1>

  <div class="instructions">
    <h2>How to Play</h2>
    <ul>
      <li>
        <span class="badge" style="background: #2ea44f;"></span>
        <strong>Green</strong> = The number/symbol is in the exact right spot.
      </li>
      <li>
        <span class="badge" style="background: #eab308;"></span>
        <strong>Yellow</strong> = The number/symbol is in the equation, but not in the right spot.
      </li>
      <li>
        <span class="badge" style="background: #787c7e;"></span>
        <strong>Gray</strong> = It is not in the equation.
      </li>
    </ul>
  </div>

  <a href="./level-1/">Play Level 1</a>
  <a href="./level-3/">Play Level 3</a>
</body>
</html>
